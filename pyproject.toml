[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tau2"
version = "2.0.0"
description = "Accountable airline customer-service agents, built on the tau-bench airline text task (English)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
    { name = "Victor Barres", email = "victor.barres@gmail.com" },
    { name = "Honghua Dong", email = "dhh19951@gmail.com" }
]
dependencies = [
    "rich",
    "pandas>=2.2.3",
    "loguru>=0.7.3",
    "docstring-parser>=0.16",
    "litellm>=1.80.15,<1.82.7",
    "tenacity>=9.0.0",
    "deepdiff>=8.4.2",
    "addict>=2.4.0",
    "PyYAML>=6.0.2",
    "toml>=0.10.2",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-xdist>=3.5.0",
    "ruff>=0.9.1",
    "pre-commit>=4.0.0",
]

[project.urls]
Repository = "https://github.com/ChristineLH01/Accountable-Airline-Customer-Service-Agents"
Upstream = "https://github.com/sierra-research/tau2-bench"

[project.scripts]
tau2 = "tau2.cli:main"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:litellm.*:",
    "ignore:Pydantic serializer warnings:UserWarning:pydantic.*:",
]
markers = [
    "live_api: calls paid model APIs (opt in with --run-live-api)",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501", "F541"]

[tool.ruff]
line-length = 88
exclude = ["*.ipynb"]
